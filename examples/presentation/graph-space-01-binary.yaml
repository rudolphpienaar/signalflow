                  output_ports: [{signal: "d5_aaaaa", return: "r5_aaaaa"}]
                  internal_wiring: ["d4_aaaa:d5_aaaaa", "r5_aaaaa:r4_aaaa"]
                  calls:
                    - module: Depth5.ts
                      func: "export_AAAAA()"
                      input_ports: [{signal: "d5_aaaaa", return: "r5_aaaaa"}]
                - module: Depth4.ts
                  func: "analyze_AAAB()"
                  input_ports: [{signal: "d4_aaab", return: "r4_aaab"}]
                  output_ports: [{signal: "d5_aaaba", return: "r5_aaaba"}]
                  internal_wiring: ["d4_aaab:d5_aaaba", "r5_aaaba:r4_aaab"]
                  calls:
                    - module: Depth5.ts
