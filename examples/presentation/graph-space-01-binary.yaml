# Graph Space Explosion: Binary Branching (d=2, L=5)
#
# Demonstrates the combinatorial explosion of workflow action space
# with 2 choices at each depth level over 5 decision points.
#
# Total possible paths: 2^5 = 32 paths
# This diagram shows ALL possible execution paths when an agent
# has 2 tool choices at each step.
#
# For IAS paper: Shows how |S(G)| grows exponentially with depth L
# Even with modest branching factor d=2, the space becomes large.
#
# Clinical context:
#   images_collect() → [preprocess_A | preprocess_B]
#                   → [segment_A | segment_B]
#                   → [validate_A | validate_B]
#                   → [analyze_A | analyze_B]
#                   → [export_A | export_B]

title: "Action Space: Binary Tree (2^5 = 32 paths)"

config:
  channelWidth: 24
  verticalChipPadding: 2

world:
  sense: west_to_east
  occupancy_policy: strip
  packing_policy: monotone
  module_box_padding: 2

tree:
  module: Clinical.ts
  func: "images_collect()"
  output_ports:
    # Layer 1: 2 branches
    - {signal: "d1_a", return: "r1_a"}
    - {signal: "d1_b", return: "r1_b"}
  calls:
    # Branch 1A
    - module: Depth1.ts
      func: "preprocess_A()"
      input_ports: [{signal: "d1_a", return: "r1_a"}]
      output_ports:
        - {signal: "d2_aa", return: "r2_aa"}
        - {signal: "d2_ab", return: "r2_ab"}
      internal_wiring: ["d1_a:d2_aa", "d1_a:d2_ab", "r2_aa:r1_a", "r2_ab:r1_a"]
      calls:
        # Branch 1AA
        - module: Depth2.ts
          func: "segment_AA()"
          input_ports: [{signal: "d2_aa", return: "r2_aa"}]
          output_ports:
            - {signal: "d3_aaa", return: "r3_aaa"}
            - {signal: "d3_aab", return: "r3_aab"}
          internal_wiring: ["d2_aa:d3_aaa", "d2_aa:d3_aab", "r3_aaa:r2_aa", "r3_aab:r2_aa"]
          calls:
            # Branch 1AAA
            - module: Depth3.ts
              func: "validate_AAA()"
              input_ports: [{signal: "d3_aaa", return: "r3_aaa"}]
              output_ports:
                - {signal: "d4_aaaa", return: "r4_aaaa"}
                - {signal: "d4_aaab", return: "r4_aaab"}
              internal_wiring: ["d3_aaa:d4_aaaa", "d3_aaa:d4_aaab", "r4_aaaa:r3_aaa", "r4_aaab:r3_aaa"]
              calls:
                - module: Depth4.ts
                  func: "analyze_AAAA()"
