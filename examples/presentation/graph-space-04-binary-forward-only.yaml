                  calls:
                    - module: Depth5.ts
                      func: "export_BAAAA()"
                      input_ports: [{signal: "d5_baaaa"}]
                - module: Depth4.ts
                  func: "analyze_BAAB()"
                  input_ports: [{signal: "d4_baab"}]
                  output_ports: [{signal: "d5_baaba"}]
                  calls:
