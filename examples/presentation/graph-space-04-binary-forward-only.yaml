                      func: "export_BAABA()"
                      input_ports: [{signal: "d5_baaba"}]
            - module: Depth3.ts
              func: "validate_BAB()"
              input_ports: [{signal: "d3_bab"}]
              output_ports:
                - signal: "d4_baba"
                - signal: "d4_babb"
              calls:
                - module: Depth4.ts
                  func: "analyze_BABA()"
                  input_ports: [{signal: "d4_baba"}]
                  output_ports: [{signal: "d5_babaa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_BABAA()"
                      input_ports: [{signal: "d5_babaa"}]
                - module: Depth4.ts
                  func: "analyze_BABB()"
                  input_ports: [{signal: "d4_babb"}]
                  output_ports: [{signal: "d5_babba"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_BABBA()"
                      input_ports: [{signal: "d5_babba"}]
        - module: Depth2.ts
          func: "segment_BB()"
          input_ports: [{signal: "d2_bb"}]
          output_ports:
