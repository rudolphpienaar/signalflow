# Graph Space Explosion: Binary Tree (FORWARD-ONLY)
#
# Simplified version with no return signals for cleaner visualization.
# Shows only the forward execution paths through the action space.
#
# Total possible paths: 2^5 = 32 paths
#
# For IAS paper presentations: This version is visually clearer for
# demonstrating exponential growth without the density of return wires.

title: "Action Space: Binary Tree (2^5 = 32 paths, forward-only)"

config:
  channelWidth: 26
  verticalChipPadding: 3

world:
  sense: west_to_east
  occupancy_policy: strip
  packing_policy: monotone

tree:
  module: Clinical.ts
  func: "images_collect()"
  output_ports:
    - signal: "d1_a"
    - signal: "d1_b"
  calls:
    # Branch A
    - module: Depth1.ts
      func: "preprocess_A()"
      input_ports: [{signal: "d1_a"}]
      output_ports:
        - signal: "d2_aa"
        - signal: "d2_ab"
      calls:
        - module: Depth2.ts
          func: "segment_AA()"
          input_ports: [{signal: "d2_aa"}]
          output_ports:
            - signal: "d3_aaa"
            - signal: "d3_aab"
          calls:
            - module: Depth3.ts
              func: "validate_AAA()"
              input_ports: [{signal: "d3_aaa"}]
              output_ports:
                - signal: "d4_aaaa"
                - signal: "d4_aaab"
              calls:
                - module: Depth4.ts
                  func: "analyze_AAAA()"
                  input_ports: [{signal: "d4_aaaa"}]
                  output_ports: [{signal: "d5_aaaaa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_AAAAA()"
                      input_ports: [{signal: "d5_aaaaa"}]
                - module: Depth4.ts
                  func: "analyze_AAAB()"
                  input_ports: [{signal: "d4_aaab"}]
                  output_ports: [{signal: "d5_aaaba"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_AAABA()"
                      input_ports: [{signal: "d5_aaaba"}]
            - module: Depth3.ts
              func: "validate_AAB()"
              input_ports: [{signal: "d3_aab"}]
              output_ports:
                - signal: "d4_aaba"
                - signal: "d4_aabb"
              calls:
                - module: Depth4.ts
                  func: "analyze_AABA()"
                  input_ports: [{signal: "d4_aaba"}]
                  output_ports: [{signal: "d5_aabaa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_AABAA()"
                      input_ports: [{signal: "d5_aabaa"}]
                - module: Depth4.ts
                  func: "analyze_AABB()"
                  input_ports: [{signal: "d4_aabb"}]
                  output_ports: [{signal: "d5_aabba"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_AABBA()"
                      input_ports: [{signal: "d5_aabba"}]
        - module: Depth2.ts
          func: "segment_AB()"
          input_ports: [{signal: "d2_ab"}]
          output_ports:
            - signal: "d3_aba"
            - signal: "d3_abb"
          calls:
            - module: Depth3.ts
              func: "validate_ABA()"
              input_ports: [{signal: "d3_aba"}]
              output_ports:
                - signal: "d4_abaa"
                - signal: "d4_abab"
              calls:
                - module: Depth4.ts
                  func: "analyze_ABAA()"
                  input_ports: [{signal: "d4_abaa"}]
                  output_ports: [{signal: "d5_abaaa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_ABAAA()"
                      input_ports: [{signal: "d5_abaaa"}]
                - module: Depth4.ts
                  func: "analyze_ABAB()"
                  input_ports: [{signal: "d4_abab"}]
                  output_ports: [{signal: "d5_ababa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_ABABA()"
                      input_ports: [{signal: "d5_ababa"}]
            - module: Depth3.ts
              func: "validate_ABB()"
              input_ports: [{signal: "d3_abb"}]
              output_ports:
                - signal: "d4_abba"
                - signal: "d4_abbb"
              calls:
                - module: Depth4.ts
                  func: "analyze_ABBA()"
                  input_ports: [{signal: "d4_abba"}]
                  output_ports: [{signal: "d5_abbaa"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_ABBAA()"
                      input_ports: [{signal: "d5_abbaa"}]
                - module: Depth4.ts
                  func: "analyze_ABBB()"
                  input_ports: [{signal: "d4_abbb"}]
                  output_ports: [{signal: "d5_abbba"}]
                  calls:
                    - module: Depth5.ts
                      func: "export_ABBBA()"
                      input_ports: [{signal: "d5_abbba"}]

    # Branch B
    - module: Depth1.ts
      func: "preprocess_B()"
      input_ports: [{signal: "d1_b"}]
      output_ports:
        - signal: "d2_ba"
        - signal: "d2_bb"
      calls:
