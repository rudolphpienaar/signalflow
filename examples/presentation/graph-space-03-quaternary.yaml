# Graph Space Explosion: Quaternary Branching (d=4, L=3)
#
# Demonstrates combinatorial explosion with 4 choices at each depth.
# Using depth 3 to keep diagram manageable for presentation.
#
# Total possible paths: 4^3 = 64 paths
#
# For IAS paper: At d=4, the action space |S(G)| = 4^L explodes rapidly
# With just 3 decision points, we already have 64 possible workflows.
# This is a realistic branching factor for clinical tool registries.
#
# Clinical context: Four preprocessing algorithms, four segmentation
# methods, four validation approaches - representing real-world choices
# in medical imaging pipelines.

title: "Action Space: Quaternary Tree (4^3 = 64 paths)"

config:
