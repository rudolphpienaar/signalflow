# Graph Space Explosion: Ternary Branching (d=3, L=4)
#
# Demonstrates combinatorial explosion with 3 choices at each depth.
# Due to visualization constraints, showing depth 4 instead of 5.
#
# Total possible paths: 3^4 = 81 paths
#
# For IAS paper: At d=3, the action space |S(G)| = 3^L grows faster
# With just 4 decision points, we already have 81 possible workflows.
# Only a tiny subset S_valid would be clinically acceptable.
#
# Clinical context: Three preprocessing methods, three segmentation
# algorithms, three validation strategies, three analysis pipelines.

