# Graph Space Explosion: Quaternary Tree (FORWARD-ONLY)
#
# Simplified version with no return signals for cleaner visualization.
# Shows only the forward execution paths.
#
# Total possible paths: 4^3 = 64 paths
#
# This is the most realistic configuration for clinical tool registries:
# - 4 choices per decision point
# - 3 decision points
# - Produces 64 distinct workflows

title: "Action Space: Quaternary Tree (4^3 = 64 paths, forward-only)"

config:
  channelWidth: 24
  verticalChipPadding: 3

world:
  sense: west_to_east
  occupancy_policy: strip
  packing_policy: monotone

