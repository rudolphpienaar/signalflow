# Wire-model case: NON-ROOT PARENT WITH THREE ORDERED CHILD CALLS
#
# This file currently models only the explicit call graph and port bindings:
#
#   main() -> merge()
#   merge() -> fetch()   via query/results
#   merge() -> filter()  via results/filtered
#   merge() -> rank()    via filtered/ranked
#
# The important property for the routing engine is that `merge()` is a
# non-root parent in one zone and all three children live in the neighboring
# zone. That produces one parent call plus three seam-crossing child calls.

title: "main->merge->[fetch,filter,rank]"
tree:
  module: App.ts
  func: "main()"
  output_ports:
    - signal: "query"
      return: "merged"
  calls:
    - module: Merger.ts
      func: "merge()"
      input_ports:
        - signal: "query"
          return: "merged"
      output_ports:
        - signal: "query"
          return: "results"
        - signal: "results"
          return: "filtered"
        - signal: "filtered"
          return: "ranked"
      calls:
        - module: Fetcher.ts
          func: "fetch()"
          input_ports:
            - signal: "query"
              return: "results"
          calls: []
        - module: Filter.ts
          func: "filter()"
          input_ports:
            - signal: "results"
              return: "filtered"
          calls: []
        - module: Ranker.ts
          func: "rank()"
          input_ports:
            - signal: "filtered"
              return: "ranked"
          calls: []
